plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.emulate.app'
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.emulate.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++20"
            }
        }
    }

    buildTypes {
        release {
            // R8 makes the Compose screens noticeably smoother than an unoptimised build.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    packaging {
        jniLibs {
            // Keep cores uncompressed so they can be dlopen()ed straight from the APK.
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    // Installs the libraries' baseline profiles (Compose ships them) on sideloaded APKs too, so
    // list scrolling runs precompiled code from the first launch.
    implementation libs.androidx.profileinstaller
    implementation libs.google.material
}
